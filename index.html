<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CineLog</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07080f;--surface:#0f1117;--surface2:#161822;--surface3:#1d1f2e;
  --border:#ffffff0f;--border2:#ffffff18;--border3:#ffffff28;
  --text:#f1f2f7;--text2:#9395a5;--text3:#5c5e70;
  --accent:#6c63ff;--accent2:#8b5cf6;--accent-glow:#6c63ff30;
  --gold:#fbbf24;--purple:#c084fc;--green:#34d399;--red:#f87171;--blue:#60a5fa;
  --radius:14px;--radius-sm:8px;--radius-lg:20px;
  --transition:all 0.22s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}

/* BG ambient */
body::before{content:'';position:fixed;top:-30%;left:-20%;width:600px;height:600px;background:radial-gradient(circle,#6c63ff12 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,#8b5cf612 0%,transparent 70%);pointer-events:none;z-index:0}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(7,8,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.hbtn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:var(--transition);white-space:nowrap}
.hbtn:hover{background:var(--surface3);border-color:var(--border3);color:var(--text)}
.hbtn-primary{background:var(--accent);border-color:transparent;color:#fff}
.hbtn-primary:hover{background:#7c74ff;border-color:transparent;color:#fff}
.hbtn svg{width:14px;height:14px;flex-shrink:0}

/* STATS */
.stats-bar{padding:20px 28px 0;position:relative;z-index:1}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 18px;display:flex;flex-direction:column;align-items:center;min-width:80px}
.stat-num{font-size:20px;font-weight:700;color:var(--text);line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.legend-row{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:16px}
.legend-chip{font-size:10px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;white-space:nowrap}
.legend-chip span{color:var(--gold)}
.legend-chip.special span{color:var(--purple)}

/* TABS */
.tabs-wrap{padding:0 28px;position:sticky;top:64px;z-index:90;background:rgba(7,8,15,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:2px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:14px 18px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;cursor:pointer;position:relative;white-space:nowrap;transition:color 0.15s;display:flex;align-items:center;gap:6px}
.tab-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:0;transition:opacity 0.15s}
.tab-btn.active{color:var(--text)}
.tab-btn.active::after{opacity:1}
.tab-btn:hover{color:var(--text2)}
.tab-icon{font-size:15px}

/* CONTENT */
#content{position:relative;z-index:1;min-height:60vh}

/* TOP PAGE */
.top-page{padding:28px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.filter-row{display:flex;gap:8px}
.fsel{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text2);font-size:12px;cursor:pointer;outline:none;transition:var(--transition);font-family:inherit}
.fsel:hover,.fsel:focus{border-color:var(--border3);color:var(--text)}
.top-list{display:flex;flex-direction:column;gap:10px}

.top-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:stretch;overflow:hidden;transition:var(--transition);cursor:default;position:relative}
.top-card::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--accent-glow) 0%,transparent 40%);opacity:0;transition:opacity 0.3s;pointer-events:none}
.top-card:hover{border-color:var(--border3);transform:translateX(4px)}
.top-card:hover::before{opacity:1}
.tc-poster{width:76px;flex-shrink:0;position:relative;overflow:hidden}
.tc-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s}
.top-card:hover .tc-poster img{transform:scale(1.05)}
.tc-poster-ph{width:76px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px}
.tc-rank{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);border-radius:6px;padding:3px 7px;font-size:12px;font-weight:700;line-height:1}
.rank-1{color:#fbbf24}
.rank-2{color:#94a3b8}
.rank-3{color:#cd7c3a}
.rank-n{color:#4a4f6a}
.tc-body{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tc-title{font-weight:600;font-size:14px;color:var(--text);line-height:1.3}
.tc-meta{font-size:11px;color:var(--text3)}
.tc-stars{display:flex;gap:1px;margin-top:2px}
.star-s{font-size:13px}
.tc-syn{font-size:11px;color:var(--text2);line-height:1.6;border-left:2px solid var(--surface3);padding-left:8px;margin-top:4px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bv{background:#34d39918;color:#34d399;border:1px solid #34d39930}
.bp{background:#fbbf2418;color:#fbbf24;border:1px solid #fbbf2430}
.bt{background:#60a5fa18;color:#60a5fa;border:1px solid #60a5fa30}

/* GENRE PAGE */
.genre-page{padding:28px}
.genre-section{margin-bottom:32px}
.genre-heading{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.genre-icon{width:32px;height:32px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.genre-label{font-size:14px;font-weight:600;color:var(--text)}
.genre-cnt{font-size:11px;color:var(--text3);margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
.genre-list{display:flex;flex-direction:column;gap:8px}

.genre-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:stretch;overflow:hidden;transition:var(--transition)}
.genre-card:hover{border-color:var(--border3);transform:translateX(4px);background:var(--surface2)}
.gc-poster{width:72px;flex-shrink:0;overflow:hidden}
.gc-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s}
.genre-card:hover .gc-poster img{transform:scale(1.05)}
.gc-poster-ph{width:72px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px}
.gc-body{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.gc-title{font-weight:600;font-size:13px;color:var(--text);line-height:1.3}
.gc-meta{font-size:10px;color:var(--text3)}
.gc-syn{font-size:11px;color:var(--text2);line-height:1.6;border-left:2px solid var(--surface3);padding-left:8px;margin-top:3px}

/* RECS PAGE */
.recs-page{padding:28px}
.recs-intro{font-size:12px;color:var(--text3);margin-bottom:24px;display:flex;align-items:center;gap:6px}
.recs-intro::before{content:'✦';color:var(--accent);font-size:10px}
.rec-section{margin-bottom:32px}
.rec-list{display:flex;flex-direction:column;gap:8px}

.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:stretch;overflow:hidden;transition:var(--transition);position:relative}
.rec-card::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#8b5cf608 0%,transparent 50%);pointer-events:none}
.rec-card:hover{border-color:var(--accent);transform:translateX(4px)}
.rc-poster{width:72px;flex-shrink:0;overflow:hidden}
.rc-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s}
.rec-card:hover .rc-poster img{transform:scale(1.05)}
.rc-poster-ph{width:72px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px}
.rc-body{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.rc-title{font-weight:600;font-size:13px;color:var(--text)}
.rc-meta{font-size:10px;color:var(--text3)}
.rc-syn{font-size:11px;color:var(--text2);line-height:1.6}
.rc-reason{font-size:10px;color:#34d399;background:#34d39910;border:1px solid #34d39922;border-radius:6px;padding:4px 8px;margin-top:2px;line-height:1.5}
.rc-add{align-self:flex-start;margin-top:6px;background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text3);padding:4px 10px;font-size:10px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:inherit}
.rc-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

/* MY LIST */
.list-page{padding:0}
.filter-bar{display:flex;gap:8px;padding:20px 28px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px 8px 33px;color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:inherit}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent);background:var(--surface3)}
.list-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:20px 28px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;gap:12px;padding:14px;transition:var(--transition);align-items:flex-start;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-glow) 0%,transparent 60%);opacity:0;transition:opacity 0.3s;pointer-events:none}
.card:hover{border-color:var(--border3);background:var(--surface2)}
.card:hover::after{opacity:1}
.card-img{width:64px;flex-shrink:0;border-radius:8px;overflow:hidden}
.card-img img{width:64px;aspect-ratio:2/3;object-fit:cover;display:block}
.card-img-ph{width:64px;aspect-ratio:2/3;background:var(--surface3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card-title{font-weight:600;font-size:13px;color:var(--text);line-height:1.3}
.card-year{font-size:11px;color:var(--text3);font-weight:400}
.card-btns{display:flex;gap:3px;flex-shrink:0}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px;border-radius:5px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--text);background:var(--surface3)}
.icon-btn.del:hover{color:var(--red);background:#f8717115}
.icon-btn svg{width:14px;height:14px}
.syn-text{font-size:11px;color:var(--text2);line-height:1.6;border-left:2px solid var(--surface3);padding-left:8px;display:none}
.card-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.star-row{display:flex;gap:1px}
.star-btn{font-size:16px;color:var(--surface3);cursor:pointer;background:none;border:none;padding:0;line-height:1;transition:color 0.1s}
.star-btn.on{color:var(--gold)}
.star-btn.on-6{color:var(--purple)}
.card-actions{display:flex;gap:5px}
.action-btn{font-size:10px;padding:3px 9px;border-radius:5px;background:transparent;border:1px solid var(--border2);color:var(--text3);cursor:pointer;transition:var(--transition);font-family:inherit;font-weight:500}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty-icon{font-size:52px;margin-bottom:14px;display:block}
.empty p{font-size:14px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;transform:translateY(16px) scale(0.98);transition:transform 0.25s cubic-bezier(.4,0,.2,1)}
.modal-bg.open .modal{transform:none}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-title{font-size:16px;font-weight:600;color:var(--text)}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text3);cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition)}
.modal-close:hover{background:var(--surface3);color:var(--text)}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.form-control{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:var(--transition);font-family:inherit}
.form-control:focus{border-color:var(--accent);background:var(--surface3)}
.form-control::placeholder{color:var(--text3)}
textarea.form-control{resize:vertical;min-height:80px}
.form-submit{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius-sm);color:#fff;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity 0.2s;font-family:inherit}
.form-submit:hover{opacity:.9}

/* TOAST */
.toast{position:fixed;bottom:28px;right:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 18px;font-size:12px;color:var(--text);z-index:9999;transform:translateY(20px);opacity:0;transition:all 0.25s cubic-bezier(.4,0,.2,1);max-width:260px;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateY(0);opacity:1}
.toast::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;flex-shrink:0}

@media(max-width:640px){
  .header{padding:0 16px}
  .stats-bar,.tabs-wrap,.genre-page,.top-page,.recs-page{padding-left:16px;padding-right:16px}
  .filter-bar,.list-grid{padding-left:16px;padding-right:16px}
  .list-grid{grid-template-columns:1fr}
  .hbtn span{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo-area">
    <div class="logo-icon">🎬</div>
    <div>
      <div class="logo-text">CineLog</div>
      <div class="logo-sub">Watchlist de Carlos Andrés</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="hbtn hbtn-primary" onclick="openAdd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Agregar</span>
    </button>
    <button class="hbtn" onclick="exportData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Exportar</span>
    </button>
    <button class="hbtn" onclick="document.getElementById('imp').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Importar</span>
    </button>
    <input id="imp" type="file" accept=".json" style="display:none" onchange="importData(event)"/>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-row" id="stats"></div>
  <div class="legend-row">
    <div class="legend-chip"><span>★</span> No lo terminé</div>
    <div class="legend-chip"><span>★★</span> Aburrido</div>
    <div class="legend-chip"><span>★★★</span> Bueno</div>
    <div class="legend-chip"><span>★★★★</span> Recomendado</div>
    <div class="legend-chip"><span>★★★★★</span> Muy recomendado</div>
    <div class="legend-chip special"><span>★★★★★★</span> Tienes que verlo</div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab-btn active" id="tab-top" onclick="switchTab('top')"><span class="tab-icon">🏆</span> Top</button>
    <button class="tab-btn" id="tab-generos" onclick="switchTab('generos')"><span class="tab-icon">🎭</span> Por género</button>
    <button class="tab-btn" id="tab-recs" onclick="switchTab('recs')"><span class="tab-icon">✨</span> Recomendaciones</button>
    <button class="tab-btn" id="tab-lista" onclick="switchTab('lista')"><span class="tab-icon">📋</span> Mi lista</button>
  </div>
</div>

<div id="content"></div>

<!-- Modal -->
<div class="modal-bg" id="modal" onclick="closeModalOut(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Agregar título</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group"><label class="form-label">Título *</label><input class="form-control" id="f-title" placeholder="Nombre de la película o serie"/></div>
    <div class="form-group"><label class="form-label">Año</label><input class="form-control" type="number" id="f-year" placeholder="2024" min="1900" max="2030"/></div>
    <div class="form-group"><label class="form-label">Tipo</label>
      <select class="form-control" id="f-type"><option>Película</option><option>Serie</option></select></div>
    <div class="form-group"><label class="form-label">Género</label>
      <select class="form-control" id="f-genre">
        <option>Acción</option><option>Comedia</option><option>Drama</option><option>Terror</option>
        <option>Ciencia ficción</option><option>Thriller</option><option>Animación</option>
        <option>Documental</option><option>Romance</option><option>Fantasía</option><option>Crimen</option>
      </select></div>
    <div class="form-group"><label class="form-label">Estado</label>
      <select class="form-control" id="f-status"><option>Pendiente</option><option>Vista</option></select></div>
    <div class="form-group"><label class="form-label">Sinopsis</label>
      <textarea class="form-control" id="f-synopsis" placeholder="Breve descripción..."></textarea></div>
    <button class="form-submit" onclick="saveModal()">Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TMDB_KEY="8eecc7858e7ef2e760f4d6051b9ec91e";
const TMDB_IMG="https://image.tmdb.org/t/p/w342";

let items=[],editId=null,nextId=204,activeTab="top",tfg="",tft="";

function load(){
  try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);items=p.items||DATA;nextId=p.nextId||204;}else{items=JSON.parse(JSON.stringify(DATA));}}
  catch{items=JSON.parse(JSON.stringify(DATA));}
}
function save(){localStorage.setItem(SK,JSON.stringify({items,nextId}));}

function exportData(){
  const b=new Blob([JSON.stringify({items,nextId},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cinelog_backup.json";a.click();
  toast("Lista exportada ✓");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.items){items=p.items;nextId=p.nextId||204;save();renderStats();render();toast("Lista importada ✓");}}catch{toast("Archivo inválido");}};
  r.readAsText(f);e.target.value="";
}

function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

function openEdit(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;

  document.getElementById("f-title").value=item.title;

function closeModal(){document.getElementById("modal").classList.remove("open");}
function closeModalOut(e){if(e.target.id==="modal")closeModal();}
async function saveModal(){
  const title=document.getElementById("f-title").value.trim();
  if(!title){toast("El título es obligatorio");return;}
  const d={title,year:parseInt(document.getElementById("f-year").value)||null,type:document.getElementById("f-type").value,genre:document.getElementById("f-genre").value,status:document.getElementById("f-status").value,synopsis:document.getElementById("f-synopsis").value.trim()};
  if(editId){items=items.map(i=>i.id===editId?{...i,...d}:i);toast("Guardado ✓");}
  else{items.push({...d,id:nextId++,rating:0});toast("Agregado ✓");}
  save();renderStats();await fetchPoster(d.title,d.year,d.type);render();closeModal();
}
function del(id){
  if(!confirm("¿Eliminar?"))return;
  items=items.filter(i=>i.id!==id);save();renderStats();render();toast("Eliminado");
}
function toggleStatus(id){
  items=items.map(i=>i.id===id?{...i,status:i.status==="Vista"?"Pendiente":"Vista"}:i);
  save();renderStats();render();
}
function setRating(id,val){
  items=items.map(i=>i.id===id?{...i,rating:i.rating===val?0:val}:i);
  save();renderStats();render();
}
function toggleSyn(id){
  const el=document.getElementById("syn-"+id);
  if(el)el.style.display=el.style.display==="block"?"none":"block";
}
async function addRec(idx){
  const r=RECS[idx];
  if(items.find(i=>i.title.toLowerCase()===r.title.toLowerCase())){toast("Ya está en tu lista");return;}
  items.push({id:nextId++,title:r.title,year:r.year,type:r.type,genre:r.genre,status:"Pendiente",rating:0,synopsis:r.synopsis});
  save();renderStats();await fetchPoster(r.title,r.year,r.type);render();toast(`"${r.title}" añadida ✓`);
}
function applyTopFilter(){
  tfg=document.getElementById("tfg")?.value||"";

  render();
}

// TMDB
async function fetchPoster(title,year,type){
  const k=`${title}__${year}__${type}`;
  if(PC[k]!==undefined)return PC[k];
  PC[k]=null;
  try{
    const q=encodeURIComponent(title.replace(/\(.*\)/g,"").trim());
    const ep=type==="Serie"?"tv":"movie";
    const yr=year?(type==="Serie"?`&first_air_date_year=${year}`:`&year=${year}`):"";
    const res=await fetch(`${TMDB_BASE}/search/${ep}?api_key=${TMDB_KEY}&query=${q}${yr}&language=es-MX`);
    const data=await res.json();
    const hit=(data.results||[])[0];
    if(hit?.poster_path)PC[k]=TMDB_IMG+hit.poster_path;
  }catch(e){}
  return PC[k];
}
async function preload(list){
  await Promise.all(list.map(i=>fetchPoster(i.title,i.year,i.type)));
  render();
}

function pImg(title,year,type,fallback,cls){
  const src=PC[`${title}__${year}__${type}`]||null;
  if(src)return `<img src="${src}" class="${cls}" loading="lazy" onerror="this.style.display='none'"/>`;
  return `<div class="${cls}-ph">${fallback}</div>`;
}

function stars(rating,size=13){
  let h="";
  for(let s=1;s<=MS;s++){
    const lit=rating>=s;
    const color=lit?(s===MS?"var(--purple)":"var(--gold)"):"var(--surface3)";
    h+=`<span class="star-s" style="font-size:${size}px;color:${color}">★</span>`;
  }
  return h;
}

// RENDER TOP
function renderTop(){
  let ranked=[...items].filter(i=>i.rating>0);
  if(tfg)ranked=ranked.filter(i=>i.genre===tfg);
  if(tft)ranked=ranked.filter(i=>i.type===tft);
  ranked.sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title));
  const rl=i=>i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`;
  const rc=i=>i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"rank-n";
  const genreOpts=GENRES.map(g=>`<option value="${g}" ${tfg===g?"selected":""}>${g}</option>`).join("");
  const cards=ranked.length?ranked.map((item,i)=>{
    const src=PC[`${item.title}__${item.year}__${item.type}`]||null;
    const img=src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"/>`:`<div class="tc-poster-ph">${GE[item.genre]||"🎬"}</div>`;
    return `<div class="top-card">
      <div class="tc-poster" style="position:relative;width:76px;flex-shrink:0;overflow:hidden">${img}<div class="tc-rank ${rc(i)}">${rl(i)}</div></div>
      <div class="tc-body">
        <div class="tc-title">${item.title} <span style="font-size:11px;color:var(--text3);font-weight:400">${item.year?"("+item.year+")":""}</span></div>
        <div class="tc-meta">${item.genre} · ${item.type}</div>
        <div class="tc-stars">${stars(item.rating,14)}</div>
        ${item.synopsis?`<div class="tc-syn">${item.synopsis}</div>`:""}
      </div>
    </div>`;
  }).join(""):`<div class="empty"><span class="empty-icon">🏆</span><p>No hay títulos calificados</p></div>`;

  return `<div class="top-page">
    <div class="page-header">
      <div class="page-title">🏆 Top calificados</div>
      <div class="filter-row">
        <select class="fsel" id="tfg" onchange="applyTopFilter()">
          <option value="" ${!tfg?"selected":""}>Todos los géneros</option>${genreOpts}
        </select>
        <select class="fsel" id="tft" onchange="applyTopFilter()">
          <option value="" ${!tft?"selected":""}>Tipo: Todos</option>
          <option value="Película" ${tft==="Película"?"selected":""}>Película</option>
          <option value="Serie" ${tft==="Serie"?"selected":""}>Serie</option>
        </select>
      </div>
    </div>
    <div class="top-list">${cards}</div>
  </div>`;
}

// RENDER GÉNERO
function renderGeneros(){
  const bg={};
  items.forEach(i=>{if(!bg[i.genre])bg[i.genre]=[];bg[i.genre].push(i);});
  const present=GENRES.filter(g=>bg[g]);
  if(!present.length)return `<div class="genre-page"><div class="empty"><span class="empty-icon">🎭</span><p>Agrega títulos para verlos por género</p></div></div>`;
  return `<div class="genre-page">${present.map(g=>{
    const cards=bg[g].map(item=>{
      const src=PC[`${item.title}__${item.year}__${item.type}`]||null;
      const img=src?`<div class="gc-poster"><img src="${src}" loading="lazy"/></div>`:`<div class="gc-poster gc-poster-ph">${GE[item.genre]||"🎬"}</div>`;
      return `<div class="genre-card">${img}
        <div class="gc-body">
          <div class="gc-title">${item.title} <span style="font-size:10px;color:var(--text3);font-weight:400">${item.year?"("+item.year+")":""}</span></div>
          <div class="badges"><span class="badge ${item.status==="Vista"?"bv":"bp"}">${item.status}</span><span class="badge bt">${item.type}</span></div>
          <div>${item.rating?stars(item.rating):`<span style="font-size:10px;color:var(--text3)">Sin calificar</span>`}</div>
          ${item.synopsis?`<div class="gc-syn">${item.synopsis}</div>`:""}
        </div>
      </div>`;
    }).join("");
    return `<div class="genre-section">
      <div class="genre-heading">
        <div class="genre-icon">${GE[g]||"🎬"}</div>
        <span class="genre-label">${g}</span>
        <span class="genre-cnt">${bg[g].length}</span>
      </div>
      <div class="genre-list">${cards}</div>
    </div>`;
  }).join("")}</div>`;
}

// RENDER RECS
function renderRecs(){
  const inList=new Set(items.map(i=>i.title.toLowerCase()));
  const filtered=RECS.map((r,i)=>({...r,idx:i})).filter(r=>!inList.has(r.title.toLowerCase()));
  if(!filtered.length)return `<div class="recs-page"><div class="empty"><span class="empty-icon">✨</span><p>Ya tienes todas las recomendaciones en tu lista</p></div></div>`;
  const bg={};
  filtered.forEach(r=>{if(!bg[r.genre])bg[r.genre]=[];bg[r.genre].push(r);});
  const sections=Object.keys(bg).map(g=>`
    <div class="rec-section">
      <div class="genre-heading">
        <div class="genre-icon">${GE[g]||"🎬"}</div>
        <span class="genre-label">${g}</span>
      </div>
      <div class="rec-list">${bg[g].map(r=>{
        const src=PC[`${r.title}__${r.year}__${r.type}`]||null;
        const img=src?`<div class="rc-poster"><img src="${src}" loading="lazy"/></div>`:`<div class="rc-poster rc-poster-ph">${GE[r.genre]||"🎬"}</div>`;
        return `<div class="rec-card">${img}
          <div class="rc-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
              <div><div class="rc-title">${r.title} <span style="font-size:10px;color:var(--text3);font-weight:400">(${r.year})</span></div><div class="rc-meta">${r.type}</div></div>
              <span class="badge bt" style="flex-shrink:0">${r.type}</span>
            </div>
            <div class="rc-syn">${r.synopsis}</div>
            <div class="rc-reason">💡 ${r.reason}</div>
            <button class="rc-add" onclick="addRec(${r.idx})">+ Añadir a mi lista</button>
          </div>
        </div>`;
      }).join("")}</div>
    </div>`).join("");
  return `<div class="recs-page"><p class="recs-intro">Picks personalizados — se actualizan automáticamente al agregar títulos a tu lista.</p>${sections}</div>`;
}

          </div>
        </div>
      </div>
    </div>`;
  }).join(""):`<div class="empty" style="grid-column:1/-1"><span class="empty-icon">🔍</span><p>Sin resultados</p></div>`;

  return `
    <div class="filter-bar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="si" placeholder="Buscar título..." oninput="render()" value="${q}"/>
      </div>
      <select class="fsel" id="ss" onchange="render()">
        <option value="">Estado: Todos</option>
        <option value="Vista" ${st==="Vista"?"selected":""}>Vista</option>
        <option value="Pendiente" ${st==="Pendiente"?"selected":""}>Pendiente</option>
      </select>
      <select class="fsel" id="st" onchange="render()">
        <option value="">Tipo: Todos</option>
        <option value="Película" ${tp==="Película"?"selected":""}>Película</option>
        <option value="Serie" ${tp==="Serie"?"selected":""}>Serie</option>
      </select>
      <select class="fsel" id="sg" onchange="render()">
        <option value="">Género: Todos</option>${gOpts}
      </select>
    </div>
    <div class="list-grid">${cards}</div>`;
}

function render(){
  const c=document.getElementById("content");
  if(activeTab==="top")c.innerHTML=renderTop();
  else if(activeTab==="generos")c.innerHTML=renderGeneros();
  else if(activeTab==="recs")c.innerHTML=renderRecs();
  else c.innerHTML=renderLista();
}

function renderStats(){
  const vistas=items.filter(i=>i.status==="Vista").length;
  const pend=items.filter(i=>i.status==="Pendiente").length;
  const rated=items.filter(i=>i.rating>0);
  const avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):"—";
  document.getElementById("stats").innerHTML=[
    {l:"Total",v:items.length},{l:"Vistas",v:vistas},{l:"Pendientes",v:pend},{l:"Avg ★",v:avg}
  ].map(s=>`<div class="stat-pill"><div class="stat-num">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join("");
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll(".tab-btn").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}

load();renderStats();render();
preload([...items,...RECS]);
</script>
</body>
</html>

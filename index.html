<!DOCTYPE html>

<head>

<title>CineLog – Watchlist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d1a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:60px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

.header{background:#12122a;border-bottom:1px solid #1e1e3a;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:700;color:#a5b4fc;letter-spacing:-0.5px}
.subtitle{font-size:12px;color:#64748b;margin-top:2px}
.header-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-primary{background:#4f46e5;border:none;border-radius:8px;color:#fff;padding:8px 14px;font-size:13px;font-weight:600}
.btn-secondary{background:transparent;border:1px solid #4f46e5;border-radius:8px;color:#a5b4fc;padding:8px 14px;font-size:13px}
.btn-ghost{background:transparent;border:1px solid #2d2d4e;border-radius:8px;color:#64748b;padding:8px 14px;font-size:13px}
.btn-primary:hover{background:#4338ca}
.btn-secondary:hover{background:#1e1b4b}
.btn-ghost:hover{background:#1a1a2e}

.stats-wrap{padding:16px 20px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stat-card{background:#12122a;border:1px solid #1e1e3a;border-radius:10px;padding:10px 18px;min-width:90px;text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#a5b4fc}
.stat-lbl{font-size:11px;color:#64748b;margin-top:2px}
.star-legend{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 14px;align-items:center}
.legend-item{font-size:11px;color:#64748b;white-space:nowrap}
.legend-dot{color:#2d2d4e;font-size:11px}

.tabs{display:flex;gap:0;padding:0 20px;border-bottom:1px solid #1e1e3a;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#64748b;padding:10px 16px;font-size:13px;font-weight:500;transition:all 0.15s;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#a5b4fc;border-bottom-color:#4f46e5}
.tab:hover:not(.active){color:#94a3b8}

.toast{position:fixed;bottom:24px;right:20px;background:#1e1b4b;border:1px solid #4f46e5;border-radius:10px;padding:12px 18px;font-size:13px;color:#a5b4fc;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.badge-vista{background:#1a3a1a;color:#4ade80;border:1px solid #166534}
.badge-pendiente{background:#2a2a1a;color:#facc15;border:1px solid #854d0e}
.badge-type{background:#1e2a3a;color:#7dd3fc;border:1px solid #1e40af}

/* Poster */
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#1a1a2e;display:block}
.poster-wrap{width:90px;flex-shrink:0;position:relative}
.poster-placeholder{width:90px;aspect-ratio:2/3;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;border:1px solid #2d2d4e}

/* ── TOP TAB ── */
.top-page{padding:20px}
.top-list{display:flex;flex-direction:column;gap:12px}
.top-card{background:#12122a;border:1px solid #1e1e3a;border-radius:14px;overflow:hidden;display:flex;align-items:stretch;transition:border-color 0.2s;gap:0}
.top-card:hover{border-color:#4f46e5}
.top-card-poster{width:80px;flex-shrink:0;position:relative}
.top-card-poster img{width:100%;height:100%;object-fit:cover;display:block}
.top-card-poster-ph{width:80px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:24px}
.top-card-rank-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.75);border-radius:6px;padding:2px 6px;font-size:13px;font-weight:800;line-height:1.4}
.rank-gold{color:#f5c518}
.rank-silver{color:#94a3b8}
.rank-bronze{color:#cd7c3a}
.rank-normal{color:#64748b}
.top-card-body{flex:1;padding:14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.top-card-title{font-weight:700;font-size:15px;color:#e2e8f0}
.top-card-meta{font-size:11px;color:#4a4a6a}
.top-card-synopsis{font-size:12px;color:#94a3b8;line-height:1.6;border-left:2px solid #2d2d4e;padding-left:8px;margin-top:2px}

/* ── POR GÉNERO ── */
.genre-page{padding:20px}
.genre-section{margin-bottom:28px}
.genre-heading{font-size:15px;font-weight:600;color:#a5b4fc;padding:0 0 10px;border-bottom:1px solid #1e1e3a;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.genre-emoji{font-size:17px}
.genre-count{font-size:11px;color:#4a4a6a;font-weight:400;margin-left:auto}
.dash-list{display:flex;flex-direction:column;gap:10px}
.dash-card{background:#12122a;border:1px solid #1e1e3a;border-radius:14px;overflow:hidden;display:flex;align-items:stretch;transition:border-color 0.2s}
.dash-card:hover{border-color:#4f46e5}
.dash-card-poster{width:80px;flex-shrink:0}
.dash-card-poster img{width:100%;height:100%;object-fit:cover;display:block}
.dash-card-poster-ph{width:80px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:28px}
.dash-card-body{flex:1;padding:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dash-title{font-weight:700;font-size:14px;color:#e2e8f0}
.dash-year{font-size:11px;color:#4a4a6a;font-weight:400}
.dash-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.dash-synopsis{font-size:11px;color:#94a3b8;line-height:1.6;border-left:2px solid #2d2d4e;padding-left:8px;margin-top:2px}

/* ── RECOMENDACIONES ── */
.recs-page{padding:20px}
.recs-intro{font-size:12px;color:#64748b;margin-bottom:20px}
.rec-genre-section{margin-bottom:24px}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-card{background:#12122a;border:1px solid #1e1e3a;border-radius:14px;overflow:hidden;display:flex;align-items:stretch;transition:border-color 0.2s}
.rec-card:hover{border-color:#7c3aed}
.rec-card-poster{width:80px;flex-shrink:0}
.rec-card-poster img{width:100%;height:100%;object-fit:cover;display:block}
.rec-card-poster-ph{width:80px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:28px}
.rec-card-body{flex:1;padding:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rec-title{font-weight:700;font-size:14px;color:#e2e8f0}
.rec-meta{font-size:10px;color:#4a4a6a}
.rec-synopsis{font-size:11px;color:#94a3b8;line-height:1.6}
.rec-reason{font-size:10px;color:#4ade80;border-left:2px solid #166534;padding-left:8px;line-height:1.5}

/* ── MI LISTA ── */
.filters{display:flex;gap:8px;padding:16px 20px;flex-wrap:wrap}
.filters input,.filters select{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:13px}
.filters input{flex:1 1 150px}
.filters input:focus,.filters select:focus{outline:1px solid #4f46e5}
.list-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:0 20px}
.card{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:12px;display:flex;gap:12px;padding:14px;transition:border-color 0.2s;align-items:flex-start}
.card:hover{border-color:#4f46e5}
.card-poster{width:70px;flex-shrink:0}
.card-poster img{width:70px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;display:block}
.card-poster-ph{width:70px;aspect-ratio:2/3;background:#12122a;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #2d2d4e}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.synopsis-block{font-size:11px;color:#94a3b8;line-height:1.6;border-left:2px solid #4f46e5;padding-left:8px;display:none}
.card-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.stars{display:flex;gap:1px}
.star{font-size:16px;color:#333;cursor:pointer;transition:color 0.1s;background:none;border:none;padding:0;line-height:1}
.star.lit-normal{color:#f5c518}
.star.lit-sixth{color:#c084fc}
.card-actions{display:flex;gap:6px}
.btn-sm{font-size:11px;padding:3px 9px;border-radius:6px;background:transparent}
.btn-sm-purple{border:1px solid #4f46e5;color:#a5b4fc}
.btn-sm-gray{border:1px solid #2d2d4e;color:#64748b}
.btn-sm-purple:hover{background:#1e1b4b}
.btn-sm-gray:hover{background:#12122a}
.btn-delete{background:none;border:none;color:#4a4a6a;font-size:14px;padding:0 2px;line-height:1}
.btn-delete:hover{color:#ef4444}
.btn-edit{background:none;border:none;color:#4f46e5;font-size:13px;padding:0 2px;line-height:1}
.btn-edit:hover{color:#a5b4fc}
.empty{text-align:center;padding:60px 20px;color:#4a4a6a}
.empty-icon{font-size:48px;margin-bottom:12px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#12122a;border:1px solid #2d2d4e;border-radius:14px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center}
.modal label{font-size:12px;color:#7c3aed;display:block;margin-bottom:4px}
.modal input,.modal select,.modal textarea{width:100%;background:#1a1a2e;border:1px solid #2d2d4e;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:14px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:1px solid #4f46e5}
.modal textarea{resize:vertical}

@media(max-width:600px){
  .dash-grid,.rec-grid,.list-grid{grid-template-columns:1fr}
  .tab{padding:10px 11px;font-size:12px}
}
</style>
</head>

  <div>
    <div class="logo">🎬 CineLog</div>

  </div>

    <button class="btn-primary" onclick="openAddModal()">+ Agregar</button>
    <button class="btn-secondary" onclick="exportData()">⬇ Exportar</button>
    <button class="btn-ghost" onclick="document.getElementById('importFile').click()">⬆ Importar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>

<div id="content"></div>

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModalOutside(event)">

    <div><label>Tipo</label><select id="f-type"><option>Película</option><option>Serie</option></select></div>
    <div><label>Género</label>
      <select id="f-genre">
        <option>Acción</option><option>Comedia</option><option>Drama</option>
        <option>Terror</option><option>Ciencia ficción</option><option>Thriller</option>

        <option>Fantasía</option><option>Crimen</option>
      </select></div>
    <div><label>Estado</label><select id="f-status"><option>Pendiente</option><option>Vista</option></select></div>
    <div><label>Sinopsis</label><textarea id="f-synopsis" rows="3"></textarea></div>
    <button class="btn-primary" style="width:100%;padding:10px;font-size:14px;border-radius:8px" onclick="saveModal()">Guardar</button>

</div>

  {title:"Mission: Impossible Dead Reckoning",year:2023,type:"Película",genre:"Acción",synopsis:"Ethan Hunt enfrenta su misión más personal y peligrosa: encontrar una misteriosa arma antes de que caiga en las manos equivocadas.",reason:"F1 y Top Gun con 5★ — Dead Reckoning es la cima del cine de acción de gran espectáculo bien ejecutado."},
  {title:"Barry",year:2018,type:"Serie",genre:"Comedia",synopsis:"Un sicario de mediano nivel descubre su pasión por la actuación mientras intenta abandonar su vida criminal en Los Ángeles.",reason:"La Oficina 5★ — Barry lleva la comedia oscura con personajes complejos al límite mezclando humor y acción."},
  {title:"The Brutalist",year:2024,type:"Película",genre:"Drama",synopsis:"Un arquitecto judío húngaro emigra a América tras la Segunda Guerra Mundial y lucha por mantener su visión artística en un país que no siempre lo acepta.",reason:"Succession y The Madison con 5-6★ — The Brutalist es el drama de mayor ambición del cine reciente, ganadora del León de Oro."},
];

let items=[], editingId=null, nextId=204, activeTab="top";
let topFilterGenre="", topFilterType="";

function load(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){const p=JSON.parse(s);items=p.items||INITIAL;nextId=p.nextId||204;}
    else{items=JSON.parse(JSON.stringify(INITIAL));}
  }catch{items=JSON.parse(JSON.stringify(INITIAL));}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({items,nextId}));}

function exportData(){
  const b=new Blob([JSON.stringify({items,nextId},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cinelog_backup.json";a.click();
  showToast("Lista exportada ✓");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.items){items=p.items;nextId=p.nextId||204;save();renderStats();render();showToast("Lista importada ✓");}}catch{showToast("Archivo inválido");}};
  r.readAsText(f);e.target.value="";
}
function showToast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

// ── TMDB ──
async function fetchPoster(title, year, type){
  const key = `${title}__${year}__${type}`;
  if(posterCache[key] !== undefined) return posterCache[key];
  posterCache[key] = null; // marca como en proceso
  try{
    const q = encodeURIComponent(title.replace(/\(.*\)/g,"").trim());
    const endpoint = type==="Serie" ? "tv" : "movie";
    const yr = year ? (type==="Serie" ? `&first_air_date_year=${year}` : `&year=${year}`) : "";
    const url = `${TMDB_BASE}/search/${endpoint}?api_key=${TMDB_KEY}&query=${q}${yr}&language=es-MX`;
    const res = await fetch(url);
    const data = await res.json();
    const results = data.results || [];
    const hit = results[0];
    if(hit && hit.poster_path){
      posterCache[key] = TMDB_IMG + hit.poster_path;
    }
  }catch(e){}
  return posterCache[key];
}

function posterImg(src, cls, emoji){
  if(src) return `<img src="${src}" class="${cls}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'${cls}-ph\\'>${emoji||"🎬"}</div>'"/>`;
  return `<div class="${cls}-ph">${emoji||"🎬"}</div>`;
}

// Precarga todos los posters y re-renderiza
async function preloadPosters(list){
  await Promise.all(list.map(i=>fetchPoster(i.title, i.year, i.type)));
  render();
}

function openAddModal(){
  editingId=null;
  document.getElementById("modal-title").textContent="Agregar título";
  ["f-title","f-synopsis"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f-year").value="";
  document.getElementById("f-type").value="Película";
  document.getElementById("f-genre").value="Acción";
  document.getElementById("f-status").value="Pendiente";
  document.getElementById("modal").style.display="flex";
}
function openEditModal(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editingId=id;
  document.getElementById("modal-title").textContent="Editar título";
  document.getElementById("f-title").value=item.title;
  document.getElementById("f-year").value=item.year||"";
  document.getElementById("f-type").value=item.type;
  document.getElementById("f-genre").value=item.genre;
  document.getElementById("f-status").value=item.status;
  document.getElementById("f-synopsis").value=item.synopsis||"";
  document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none";}
function closeModalOutside(e){if(e.target.id==="modal")closeModal();}
async function saveModal(){
  const title=document.getElementById("f-title").value.trim();
  if(!title){showToast("El título es obligatorio");return;}
  const data={title,year:parseInt(document.getElementById("f-year").value)||null,type:document.getElementById("f-type").value,genre:document.getElementById("f-genre").value,status:document.getElementById("f-status").value,synopsis:document.getElementById("f-synopsis").value.trim()};
  if(editingId){items=items.map(i=>i.id===editingId?{...i,...data}:i);showToast("Guardado ✓");}
  else{items.push({...data,id:nextId++,rating:0});showToast("Agregado ✓");}
  save();renderStats();
  await fetchPoster(data.title, data.year, data.type);
  render();closeModal();
}
function deleteItem(id){
  if(!confirm("¿Eliminar este título?"))return;
  items=items.filter(i=>i.id!==id);save();renderStats();render();showToast("Eliminado");
}
function toggleStatus(id){
  items=items.map(i=>i.id===id?{...i,status:i.status==="Vista"?"Pendiente":"Vista"}:i);
  save();renderStats();render();
}
function setRating(id,val){
  items=items.map(i=>i.id===id?{...i,rating:i.rating===val?0:val}:i);
  save();renderStats();render();
}
function toggleSyn(id){
  const el=document.getElementById("syn-"+id);
  if(el)el.style.display=el.style.display==="none"?"block":"none";
}
async function addFromRec(idx){
  const r=RECS[idx];
  if(items.find(i=>i.title.toLowerCase()===r.title.toLowerCase())){showToast("Ya está en tu lista");return;}
  items.push({id:nextId++,title:r.title,year:r.year,type:r.type,genre:r.genre,status:"Pendiente",rating:0,synopsis:r.synopsis});
  save();renderStats();
  await fetchPoster(r.title, r.year, r.type);
  render();showToast(`"${r.title}" añadida ✓`);
}
function applyTopFilter(){
  topFilterGenre=document.getElementById("top-fg")?.value||"";
  topFilterType=document.getElementById("top-ft")?.value||"";
  render();
}

function starsHTML(rating, size=13){
  let h="";
  for(let s=1;s<=MAX_STARS;s++){
    const lit=rating>=s;
    const color=lit?(s===MAX_STARS?"#c084fc":"#f5c518"):"#2d2d4e";
    h+=`<span style="font-size:${size}px;color:${color}">★</span>`;
  }
  return h;
}

/* ── TOP ── */
function renderTop(){
  let ranked=[...items].filter(i=>i.rating>0);
  if(topFilterGenre) ranked=ranked.filter(i=>i.genre===topFilterGenre);
  if(topFilterType)  ranked=ranked.filter(i=>i.type===topFilterType);
  ranked.sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title));
  const rankLabel=i=>i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`;
  const rankCls=i=>i===0?"rank-gold":i===1?"rank-silver":i===2?"rank-bronze":"rank-normal";
  const genreOpts=GENRES.map(g=>`<option value="${g}" ${topFilterGenre===g?"selected":""}>${g}</option>`).join("");
  const cards=ranked.length?ranked.map((item,i)=>{
    const src=posterCache[`${item.title}__${item.year}__${item.type}`]||null;
    const imgEl=src
      ?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"/>`
      :`<div style="width:80px;display:flex;align-items:center;justify-content:center;font-size:24px">${GENRE_EMOJI[item.genre]||"🎬"}</div>`;
    return `<div class="top-card">
      <div class="top-card-poster" style="position:relative;width:80px;flex-shrink:0">
        ${imgEl}
        <div class="top-card-rank-badge ${rankCls(i)}">${rankLabel(i)}</div>
      </div>
      <div class="top-card-body">
        <div class="top-card-title">${item.title} ${item.year?`<span style="font-size:11px;color:#4a4a6a">(${item.year})</span>`:""}</div>
        <div class="top-card-meta">${item.genre} · ${item.type}</div>
        <div>${starsHTML(item.rating,14)}</div>
        ${item.synopsis?`<div class="top-card-synopsis">${item.synopsis}</div>`:""}
      </div>
    </div>`;
  }).join(""):`<div class="empty"><div class="empty-icon">🏆</div><p>No hay títulos calificados con esos filtros</p></div>`;

  return `<div class="top-page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <span style="font-size:17px;font-weight:700;color:#a5b4fc">🏆 Top calificados</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="top-fg" onchange="applyTopFilter()" style="background:#1a1a2e;border:1px solid #2d2d4e;border-radius:8px;padding:6px 10px;color:#e2e8f0;font-size:12px;cursor:pointer">
          <option value="" ${!topFilterGenre?"selected":""}>Género: Todos</option>${genreOpts}
        </select>
        <select id="top-ft" onchange="applyTopFilter()" style="background:#1a1a2e;border:1px solid #2d2d4e;border-radius:8px;padding:6px 10px;color:#e2e8f0;font-size:12px;cursor:pointer">
          <option value="" ${!topFilterType?"selected":""}>Tipo: Todos</option>
          <option value="Película" ${topFilterType==="Película"?"selected":""}>Película</option>
          <option value="Serie" ${topFilterType==="Serie"?"selected":""}>Serie</option>
        </select>
      </div>
    </div>
    <div class="top-list">${cards}</div>
  </div>`;
}

/* ── POR GÉNERO ── */
function renderGeneros(){
  const byGenre={};
  items.forEach(i=>{if(!byGenre[i.genre])byGenre[i.genre]=[];byGenre[i.genre].push(i);});
  const present=GENRES.filter(g=>byGenre[g]);
  if(!present.length) return `<div class="genre-page"><div class="empty"><div class="empty-icon">🎬</div><p>Agrega títulos para verlos por género</p></div></div>`;
  return `<div class="genre-page">${present.map(g=>{
    const cards=byGenre[g].map(item=>{
      const src=posterCache[`${item.title}__${item.year}__${item.type}`]||null;
      const imgEl=src
        ?`<div class="dash-card-poster"><img src="${src}" loading="lazy"/></div>`
        :`<div class="dash-card-poster dash-card-poster-ph">${GENRE_EMOJI[item.genre]||"🎬"}</div>`;
      return `<div class="dash-card">
        ${imgEl}
        <div class="dash-card-body">
          <div>
            <div class="dash-title">${item.title} <span class="dash-year">${item.year?"("+item.year+")":""}</span></div>
            <div class="dash-badges">
              <span class="badge ${item.status==="Vista"?"badge-vista":"badge-pendiente"}">${item.status}</span>
              <span class="badge badge-type">${item.type}</span>
            </div>
          </div>
          <div>${item.rating?starsHTML(item.rating):`<span style="font-size:10px;color:#4a4a6a">Sin calificar</span>`}</div>
          ${item.synopsis?`<p class="dash-synopsis">${item.synopsis}</p>`:""}
        </div>
      </div>`;
    }).join("");
    return `<div class="genre-section">
      <div class="genre-heading"><span class="genre-emoji">${GENRE_EMOJI[g]||"🎬"}</span>${g}<span class="genre-count">${byGenre[g].length} título${byGenre[g].length>1?"s":""}</span></div>
      <div class="dash-list">${cards}</div>
    </div>`;
  }).join("")}</div>`;
}

/* ── RECOMENDACIONES ── */
function renderRecs(){
  const inList=new Set(items.map(i=>i.title.toLowerCase()));
  const filtered=RECS.map((r,i)=>({...r,idx:i})).filter(r=>!inList.has(r.title.toLowerCase()));
  const byGenre={};
  filtered.forEach(r=>{if(!byGenre[r.genre])byGenre[r.genre]=[];byGenre[r.genre].push(r);});
  const sections=Object.keys(byGenre).map(g=>`
    <div class="rec-genre-section">
      <div class="genre-heading"><span class="genre-emoji">${GENRE_EMOJI[g]||"🎬"}</span>${g}</div>
      <div class="rec-list">${byGenre[g].map(r=>{
        const src=posterCache[`${r.title}__${r.year}__${r.type}`]||null;
        const imgEl=src
          ?`<div class="rec-card-poster"><img src="${src}" loading="lazy"/></div>`
          :`<div class="rec-card-poster rec-card-poster-ph">${GENRE_EMOJI[r.genre]||"🎬"}</div>`;
        return `<div class="rec-card">
          ${imgEl}
          <div class="rec-card-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
              <div><div class="rec-title">${r.title} <span style="font-size:10px;color:#4a4a6a;font-weight:400">(${r.year})</span></div><div class="rec-meta">${r.type}</div></div>
              <span class="badge badge-type" style="flex-shrink:0">${r.type}</span>
            </div>
            <p class="rec-synopsis">${r.synopsis}</p>
            <div class="rec-reason">💡 ${r.reason}</div>
            <button onclick="addFromRec(${r.idx})" style="margin-top:6px;background:transparent;border:1px solid #4f46e5;border-radius:7px;color:#a5b4fc;padding:5px 12px;font-size:11px;cursor:pointer;width:100%">+ Añadir a mi lista</button>
          </div>
        </div>`;
      }).join("")}</div>
    </div>`).join("");
  return `<div class="recs-page"><p class="recs-intro">Picks personalizados — se actualizan automáticamente cuando agregas títulos a tu lista.</p>${sections||'<div class="empty"><div class="empty-icon">✨</div><p>Ya tienes todas las recomendaciones en tu lista</p></div>'}</div>`;
}

/* ── MI LISTA ── */
function renderLista(){
  const q=document.getElementById("searchInput")?.value?.toLowerCase()||"";
  const st=document.getElementById("filterStatus")?.value||"";
  const tp=document.getElementById("filterType")?.value||"";
  const gn=document.getElementById("filterGenre")?.value||"";
  const filtered=items.filter(i=>(!q||i.title.toLowerCase().includes(q))&&(!st||i.status===st)&&(!tp||i.type===tp)&&(!gn||i.genre===gn));
  const genreOpts=GENRES.map(g=>`<option value="${g}">${g}</option>`).join("");
  const cards=filtered.length?filtered.map(item=>{
    const src=posterCache[`${item.title}__${item.year}__${item.type}`]||null;
    const imgEl=src
      ?`<img src="${src}" style="width:70px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;display:block" loading="lazy"/>`
      :`<div style="width:70px;aspect-ratio:2/3;background:#12122a;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #2d2d4e">${GENRE_EMOJI[item.genre]||"🎬"}</div>`;
    const stars=Array.from({length:MAX_STARS},(_,s)=>{
      const n=s+1,lit=item.rating>=n,sixth=n===MAX_STARS;
      const cls=lit?(sixth?"lit-sixth":"lit-normal"):"";
      return `<button class="star ${cls}" onclick="setRating(${item.id},${n})" title="${n}★">★</button>`;
    }).join("");
    return `<div class="card">
      <div style="flex-shrink:0">${imgEl}</div>
      <div class="card-body">
        <div class="card-top">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px;color:#e2e8f0;line-height:1.3">${item.title} ${item.year?`<span style="font-size:11px;color:#64748b;font-weight:400">(${item.year})</span>`:""}</div>
            <div class="card-badges">
              <span class="badge ${item.status==="Vista"?"badge-vista":"badge-pendiente"}">${item.status}</span>
              <span class="badge badge-type">${item.type}</span>
              <span style="font-size:10px;color:#4a4a6a">${item.genre}</span>
            </div>
          </div>
          <div style="display:flex;gap:3px;flex-shrink:0">
            <button class="btn-edit" onclick="openEditModal(${item.id})">✎</button>
            <button class="btn-delete" onclick="deleteItem(${item.id})">✕</button>
          </div>
        </div>
        ${item.synopsis?`<p class="synopsis-block" id="syn-${item.id}">${item.synopsis}</p>`:""}
        <div class="card-footer">
          <div class="stars">${stars}</div>
          <div class="card-actions">
            <button class="btn-sm btn-sm-purple" onclick="toggleStatus(${item.id})">${item.status==="Vista"?"→ Pendiente":"→ Vista"}</button>
            ${item.synopsis?`<button class="btn-sm btn-sm-gray" onclick="toggleSyn(${item.id})">Sinopsis</button>`:""}
          </div>
        </div>
      </div>
    </div>`;
  }).join(""):`<div class="empty"><div class="empty-icon">🔍</div><p>Sin resultados</p></div>`;
  return `
    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 Buscar..." oninput="render()" value="${q}"/>
      <select id="filterStatus" onchange="render()">
        <option value="">Estado: Todos</option>
        <option value="Vista" ${st==="Vista"?"selected":""}>Vista</option>
        <option value="Pendiente" ${st==="Pendiente"?"selected":""}>Pendiente</option>
      </select>
      <select id="filterType" onchange="render()">
        <option value="">Tipo: Todos</option>
        <option value="Película" ${tp==="Película"?"selected":""}>Película</option>
        <option value="Serie" ${tp==="Serie"?"selected":""}>Serie</option>
      </select>
      <select id="filterGenre" onchange="render()">
        <option value="">Género: Todos</option>${genreOpts}
      </select>
    </div>
    <div class="list-grid">${cards}</div>`;
}

function render(){
  const c=document.getElementById("content");
  if(activeTab==="top") c.innerHTML=renderTop();
  else if(activeTab==="generos") c.innerHTML=renderGeneros();
  else if(activeTab==="recs") c.innerHTML=renderRecs();
  else c.innerHTML=renderLista();
}
function renderStats(){
  const vistas=items.filter(i=>i.status==="Vista").length;
  const pend=items.filter(i=>i.status==="Pendiente").length;
  const rated=items.filter(i=>i.rating>0);
  const avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):"—";
  document.getElementById("stats").innerHTML=[
    {l:"Total",v:items.length},{l:"Vistas ✓",v:vistas},{l:"Pendientes",v:pend},{l:"Rating prom.",v:avg+"★"}
  ].map(s=>`<div class="stat-card"><div class="stat-val">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join("");
}
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}

// Init
load();
renderStats();
render();
// Precarga posters de toda la lista + recomendaciones en background
preloadPosters([...items, ...RECS]);
</script>
